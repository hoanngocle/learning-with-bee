d top-0 w-full z-50 bg-surface-canvas/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"></header><main class="w-full pt-20 min-h-[calc(100vh-80px)] flex flex-col justify-between bg-surface-canvas"><div class="flex flex-col w-full relative overflow-hidden py-space-xl sm:py-space-2xl px-gutter items-center justify-center">

<div class="text-center mb-space-lg">
  <h1 class="font-headline-section text-headline-section text-brand-ink-dark tracking-tight">

  <p class="font-body-regular text-body-regular text-text-muted mt-1.5 max-w-sm mx-auto">

<!-- Streamlined Clean Form -->
<form class="space-y-space-md" onsubmit="event.preventDefault();">
  <!-- Username Field -->
  <div class="space-y-1.5">
    <label class="font-headline-card text-[14px] text-brand-ink-dark flex items-center gap-1.5" for="usernameInput">
      <span class="material-symbols-outlined text-level2-accent text-[18px]">person</span>
      <span>Tên đăng nhập</span>
    </label>
    <div class="relative flex items-center">
      <span class="absolute left-4 text-text-muted select-none flex items-center">
        <span class="material-symbols-outlined text-[20px]">account_circle</span>
      </span>
      <input id="usernameInput" class="w-full bg-surface-canvas rounded-xl py-3.5 pl-12 pr-4 font-body-regular text-body-regular text-on-surface placeholder:text-outline-variant focus:outline-none focus:bg-surface-card shadow-[inset_0_2px_3px_rgba(0,0,0,0.04)] focus:shadow-[0_4px_0_#d4e3ff] transition-all" placeholder="Nhập tên của bạn..." type="text" autocomplete="username">
    </div>
  </div>

  <!-- Password Field -->
  <div class="space-y-1.5">
    <div class="flex items-center justify-between">
      <label class="font-headline-card text-[14px] text-brand-ink-dark flex items-center gap-1.5" for="passwordInput">
        <span class="material-symbols-outlined text-secondary text-[18px]">lock</span>
        <span>Mật khẩu</span>
      </label>
      
    </div>
    <div class="relative flex items-center">
      <span class="absolute left-4 text-text-muted select-none flex items-center">
        <span class="material-symbols-outlined text-[20px]">key</span>
      </span>
      <input id="passwordInput" class="w-full bg-surface-canvas rounded-xl py-3.5 pl-12 pr-12 font-body-regular text-body-regular text-on-surface placeholder:text-outline-variant focus:outline-none focus:bg-surface-card shadow-[inset_0_2px_3px_rgba(0,0,0,0.04)] focus:shadow-[0_4px_0_#d4e3ff] transition-all" placeholder="Nhập mật khẩu..." type="password" autocomplete="current-password">
      <button type="button" class="absolute right-4 text-text-muted hover:text-brand-ink-dark transition-colors flex items-center" onclick="const el=document.getElementById('passwordInput'); if(el){ const isPw=el.type==='password'; el.type=isPw?'text':'password'; this.querySelector('span').textContent=isPw?'visibility_off':'visibility'; }">
        <span class="material-symbols-outlined text-[20px]">visibility</span>
      </button>
    </div>
  </div>

  <!-- Primary Action Button -->
  <div class="pt-2">
    <button class="w-full py-4 px-6 rounded-2xl bg-primary-container hover:bg-primary-container/95 text-on-primary font-action-primary text-[17px] flex items-center justify-center gap-2 shadow-[0_6px_0_#E56D27] active:translate-y-1.5 active:shadow-[0_1px_0_#E56D27] transition-all cursor-pointer" type="submit">

<script>
  // Mode Tab Switcher Interaction
  const tabKid = document.getElementById('tabKid');
  const tabParent = document.getElementById('tabParent');
  const studentFields = document.getElementById('studentFields');
  const parentFields = document.getElementById('parentFields');

  function setMode(mode) {
    if (mode === 'kid') {
      tabKid.className = 'flex-1 py-2.5 px-space-sm rounded-full flex items-center justify-center gap-2 font-action-primary text-action-primary bg-primary-container text-on-primary shadow-[0_4px_0_#E56D27] transition-all transform active:translate-y-1 active:shadow-[0_1px_0_#E56D27]';
      tabParent.className = 'flex-1 py-2.5 px-space-sm rounded-full flex items-center justify-center gap-2 font-action-secondary text-action-secondary text-on-surface-variant hover:text-brand-ink-dark transition-all';
      studentFields.classList.remove('hidden');
      parentFields.classList.add('hidden');
    } else {
      tabParent.className = 'flex-1 py-2.5 px-space-sm rounded-full flex items-center justify-center gap-2 font-action-primary text-action-primary bg-secondary text-on-primary shadow-[0_4px_0_#003b76] transition-all transform active:translate-y-1 active:shadow-[0_1px_0_#003b76]';
      tabKid.className = 'flex-1 py-2.5 px-space-sm rounded-full flex items-center justify-center gap-2 font-action-secondary text-action-secondary text-on-surface-variant hover:text-brand-ink-dark transition-all';
      studentFields.classList.add('hidden');
      parentFields.classList.remove('hidden');
    }
  }

  tabKid.addEventListener('click', () => setMode('kid'));
  tabParent.addEventListener('click', () => setMode('parent'));

  // Toggle PIN selection vs typed password
  const togglePinMethod = document.getElementById('togglePinMethod');
  const animalPinPad = document.getElementById('animalPinPad');
  const textPasswordInput = document.getElementById('textPasswordInput');

  let isAnimalPad = true;
  togglePinMethod.addEventListener('click', () => {
    isAnimalPad = !isAnimalPad;
    if (isAnimalPad) {
      animalPinPad.classList.remove('hidden');
      textPasswordInput.classList.add('hidden');
      togglePinMethod.textContent = 'Đổi dạng số bí mật';
    } else {
      animalPinPad.classList.add('hidden');
      textPasswordInput.classList.remove('hidden');
      togglePinMethod.textContent = 'Dùng con vật đáng yêu';
    }
  });

  // Toggle Eye Password
  const toggleSecretEye = document.getElementById('toggleSecretEye');
  const studentPasswordInput = document.getElementById('studentPasswordInput');
  if (toggleSecretEye && studentPasswordInput) {
    toggleSecretEye.addEventListener('click', () => {
      const type = studentPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      studentPasswordInput.setAttribute('type', type);
      const icon = toggleSecretEye.querySelector('span');
      if (icon) {
        icon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
      }
    });
  }

  // QR Modal Handlers
  const btnQrLogin = document.getElementById('btnQrLogin');
  const qrModal = document.getElementById('qrModal');
  const closeQrModal = document.getElementById('closeQrModal');
  const cancelQrBtn = document.getElementById('cancelQrBtn');

  function openQr() {
    qrModal.classList.remove('hidden');
    qrModal.classList.add('flex');
  }

  function closeQr() {
    qrModal.classList.add('hidden');
    qrModal.classList.remove('flex');
  }

  if (btnQrLogin) btnQrLogin.addEventListener('click', openQr);
  if (closeQrModal) closeQrModal.addEventListener('click', closeQr);
  if (cancelQrBtn) cancelQrBtn.addEventListener('click', closeQr);

  // Playful Animal Click Feedback
  const animalChips = document.querySelectorAll('.animal-chip');
  animalChips.forEach(chip => {
    chip.addEventListener('click', () => {
      chip.classList.add('scale-95');
      setTimeout(() => chip.classList.remove('scale-95'), 120);
    });
  });
</script></main>
